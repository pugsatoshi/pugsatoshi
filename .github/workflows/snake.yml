name: Generate Snake

on:
  schedule:
    - cron: "0 6 * * *"     # daily refresh
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=c2632f&color_dots=#fbfaf7,#e8c4a8,#d89a6a,#c2632f,#8f3f1a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=e8915a&color_dots=#1c1b19,#5a3a24,#8f5a30,#c2632f,#e8915a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
